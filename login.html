<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PAWFUR</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="auth-body">

    <div class="auth-card">
        <a href="index.html" class="logo">🐾 PAWFUR</a>
        <h1>Welcome Back!</h1>
        <p>Log in to continue caring for your pets.</p>

        <form id="loginForm">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>

            <button type="submit" class="main-button full-button">Log In</button>
        </form>

        <div class="or-divider">OR</div>

        <button type="button" class="social-button" id="googleLogin">
            Continue with Google
        </button>

        <button type="button" class="social-button" id="facebookLogin">
            Continue with Facebook
        </button>

        <p class="auth-note">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

        <a href="index.html" class="back-link">← Back to Home</a>
        <p id="loginMessage" class="form-message"></p>
    </div>

</body>
</html>
