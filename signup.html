<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PAWFUR</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="auth-body">

    <div class="auth-card">
        <a href="index.html" class="logo"><span aria-hidden="true">🐾</span> PAWFUR</a>
        <h1>Create Account</h1>
        <p>Join PAWFUR and give your pets the care they deserve.</p>
        <p id="authNotice" class="notice hidden" role="status"></p>

        <form id="signupForm">
            <label for="signupName">Full Name</label>
            <input type="text" id="signupName" placeholder="Enter your name" required>

            <label for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" placeholder="Enter your email" required>

            <label for="signupPassword">Password</label>
            <div class="password-field">
                <input type="password" id="signupPassword" placeholder="Create a password" minlength="6" required>
                <button type="button" class="password-toggle" data-target="signupPassword"
                        aria-label="Show password" title="Show password"
                        aria-controls="signupPassword" aria-pressed="false">
                    <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-eye-off hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
            </div>

            <button type="submit" class="main-button full-button">Create Account</button>
        </form>

        <p class="auth-note">
            Already have an account?
            <a href="login.html">Log In</a>
        </p>

        <a href="index.html" class="back-link">← Back to Home</a>
        <p id="signupMessage" class="form-message"></p>
    </div>

</body>
</html>
