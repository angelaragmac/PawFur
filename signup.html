<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PAWFUR</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="auth-body">

    <div class="auth-card">
        <a href="index.html" class="logo">🐾 PAWFUR</a>
        <h1>Create Account</h1>
        <p>Join PAWFUR and give your pets the care they deserve.</p>

        <form id="signupForm">
            <label>Full Name</label>
            <input type="text" id="signupName" placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" id="signupEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Create a password" minlength="6" required>

            <button type="submit" class="main-button full-button">Create Account</button>
        </form>

        <p class="auth-note">
            Already have an account?
            <a href="login.html">Log In</a>
        </p>

        <a href="index.html" class="back-link">← Back to Home</a>
        <p id="signupMessage" class="form-message"></p>
    </div>

</body>
</html>
