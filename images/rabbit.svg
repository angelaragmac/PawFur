<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 290" role="img" aria-label="Illustration of a white rabbit sitting">
  <!-- body -->
  <path d="M34 286c-10-60 4-104 66-104s76 44 66 104z" fill="#F4F6FA"/>
  <path d="M34 286c-6-34-4-62 6-82-14 20-18 52-10 82z" fill="#DDE3EC"/>
  <path d="M72 286c-4-34 0-58 28-58s32 24 28 58z" fill="#FFFFFF"/>
  <!-- paws -->
  <rect x="68" y="236" width="24" height="50" rx="12" fill="#FFFFFF"/>
  <rect x="108" y="236" width="24" height="50" rx="12" fill="#FFFFFF"/>
  <ellipse cx="80" cy="285" rx="19" ry="9" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/>
  <ellipse cx="120" cy="285" rx="19" ry="9" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="2"/>
  <!-- ears -->
  <path d="M62 78C44 34 46 6 62 4c18-2 26 34 26 76z" fill="#F4F6FA"/>
  <path d="M138 78c18-44 16-72 0-74-18-2-26 34-26 76z" fill="#F4F6FA"/>
  <path d="M63 68C54 38 55 20 62 18c8-2 12 22 12 52z" fill="#FFB3C1"/>
  <path d="M137 68c9-30 8-48 1-50-8-2-12 22-12 52z" fill="#FFB3C1"/>
  <!-- collar bow -->
  <path d="M100 190l-22-12v24zM100 190l22-12v24z" fill="#FFC857"/>
  <circle cx="100" cy="190" r="7" fill="#F28C28"/>
  <!-- head -->
  <ellipse cx="100" cy="124" rx="62" ry="56" fill="#F4F6FA"/>
  <ellipse cx="100" cy="146" rx="30" ry="22" fill="#FFFFFF"/>
  <!-- eyes -->
  <ellipse cx="76" cy="118" rx="7.5" ry="9" fill="#142B4A"/>
  <ellipse cx="124" cy="118" rx="7.5" ry="9" fill="#142B4A"/>
  <circle cx="79" cy="114" r="2.8" fill="#fff"/>
  <circle cx="127" cy="114" r="2.8" fill="#fff"/>
  <!-- blush -->
  <ellipse cx="60" cy="142" rx="9" ry="6" fill="#FF8A7A" opacity=".4"/>
  <ellipse cx="140" cy="142" rx="9" ry="6" fill="#FF8A7A" opacity=".4"/>
  <!-- nose + mouth -->
  <path d="M93 138h14l-7 8z" fill="#F28C9B"/>
  <path d="M100 146v6M100 152c-4 6-12 4-14-2M100 152c4 6 12 4 14-2" stroke="#142B4A" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- teeth -->
  <rect x="95" y="154" width="10" height="9" rx="2.5" fill="#fff" stroke="#DDE3EC" stroke-width="1.5"/>
  <!-- whiskers -->
  <path d="M62 150l-26-3M62 156l-24 7M138 150l26-3M138 156l24 7" stroke="#8C98AD" stroke-width="2" stroke-linecap="round" opacity=".7"/>
</svg>
