  <ellipse cx="152" cy="104" rx="11" ry="13" fill="#142B4A"/>
  <circle cx="92" cy="99" r="4.2" fill="#fff"/>
  <circle cx="156" cy="99" r="4.2" fill="#fff"/>
  <circle cx="85" cy="108" r="2" fill="#fff" opacity=".7"/>
  <circle cx="149" cy="108" r="2" fill="#fff" opacity=".7"/>
