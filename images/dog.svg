<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 330" role="img" aria-label="Illustration of a golden dog sitting">
  <!-- tail -->
  <path d="M188 262c34-6 52-34 44-70-3-13 10-18 15-7 14 36-2 90-52 102z" fill="#D9A05B"/>
  <!-- body -->
  <path d="M62 318c-8-70 6-130 68-130s76 60 68 130z" fill="#E9B872"/>
  <!-- chest -->
  <path d="M96 318c-4-48 2-96 34-96s38 48 34 96z" fill="#FBE6C4"/>
  <!-- front legs -->
  <rect x="88" y="236" width="30" height="84" rx="15" fill="#F3CD94"/>
  <rect x="142" y="236" width="30" height="84" rx="15" fill="#F3CD94"/>
  <ellipse cx="103" cy="318" rx="24" ry="11" fill="#FBE6C4"/>
  <ellipse cx="157" cy="318" rx="24" ry="11" fill="#FBE6C4"/>
  <path d="M95 316v-8M103 316v-9M111 316v-8M149 316v-8M157 316v-9M165 316v-8" stroke="#D9A05B" stroke-width="2" stroke-linecap="round"/>
  <!-- collar -->
  <path d="M82 196c30 20 66 20 96 0l4 20c-34 22-70 22-104 0z" fill="#142B4A"/>
  <circle cx="130" cy="226" r="11" fill="#FFC857"/>
  <circle cx="130" cy="226" r="4" fill="#F28C28"/>
  <!-- ears (floppy) -->
  <path d="M58 70c-30 6-40 52-28 92 4 14 22 14 30 0 10-18 14-52 10-80z" fill="#B9763A"/>
  <path d="M202 70c30 6 40 52 28 92-4 14-22 14-30 0-10-18-14-52-10-80z" fill="#B9763A"/>
  <!-- head -->
  <ellipse cx="130" cy="112" rx="74" ry="68" fill="#E9B872"/>
  <!-- forehead patch -->
  <path d="M130 48c-14 8-18 26-14 44 4-8 10-12 14-12s10 4 14 12c4-18 0-36-14-44z" fill="#F3CD94"/>
  <!-- muzzle -->
  <ellipse cx="130" cy="140" rx="40" ry="31" fill="#FBE6C4"/>
  <!-- eyes -->
  <ellipse cx="100" cy="108" rx="8.5" ry="10" fill="#142B4A"/>
  <ellipse cx="160" cy="108" rx="8.5" ry="10" fill="#142B4A"/>
  <circle cx="103" cy="104" r="3.2" fill="#fff"/>
  <circle cx="163" cy="104" r="3.2" fill="#fff"/>
  <!-- brows -->
  <path d="M88 90q10-8 22-3M172 90q-10-8-22-3" stroke="#B9763A" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- blush -->
  <ellipse cx="82" cy="134" rx="11" ry="7" fill="#F28C28" opacity=".28"/>
  <ellipse cx="178" cy="134" rx="11" ry="7" fill="#F28C28" opacity=".28"/>
  <!-- nose + mouth -->
  <path d="M117 124c0-6 26-6 26 0 0 8-10 14-13 14s-13-6-13-14z" fill="#142B4A"/>
  <ellipse cx="124" cy="127" rx="4" ry="2" fill="#fff" opacity=".35"/>
  <path d="M130 138v10M130 148c-6 8-18 6-20-1M130 148c6 8 18 6 20-1" stroke="#142B4A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- tongue -->
  <path d="M121 152c0 14 6 20 9 20s9-6 9-20c-6 3-12 3-18 0z" fill="#FF8A7A"/>
  <path d="M130 154v10" stroke="#E5675A" stroke-width="2" stroke-linecap="round"/>
</svg>
